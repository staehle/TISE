[package]
name = "tise"
description = "TISE: Terra Invicta Save Editor"
authors = ["Jake Staehle <jacob@staehle.us>", "Tom Lin <tom5023@live.com.au>"]
homepage = "https://github.com/staehle/tise"
repository = "https://github.com/staehle/tise"
license-file = "LICENSE"
categories = ["games"]
version = "2.3.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
# Ergonomic error handling for IO/parse/GUI glue.
anyhow = "1.0"
# Cross-platform native GUI shell for egui.
# eframe 0.36 made wgpu the default renderer; we keep its other defaults but stay on
# glow (OpenGL), which is lighter (~7 MB smaller binary) and what TISE has always shipped.
# When bumping eframe, re-check its `default` feature list: with defaults off, new ones
# (e.g. `clipboard` in 0.37) are silently dropped. `system_fonts` is left off on purpose.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
# Optional egui widgets/utilities (tables, etc.).
egui_extras = "0.37"
# Gzip read/write for `.gz` save files.
flate2 = "1.0"
# JSON object map preserving insertion order (important for stable structure/editing).
indexmap = { version = "2.14", features = ["serde"] }
# JSON5 parser (supports `Infinity`, comments, trailing commas, etc.).
# Capped below 1.3.4: that release parses every number as an integer first, and each
# failed attempt builds an error that rescans the input from the start for a line/column,
# so loading a float-heavy save goes quadratic (multi-MB saves effectively hang).
# Upstream: https://github.com/callum-oakley/json5-rs/issues/62
# Lift the cap once a fixed release is out (run `cargo test --test diff_paths` to check).
json5 = ">=1.3, <1.3.4"
# Native file open/save dialogs.
rfd = "0.17"
# Fast float-to-string for deterministic JSON number formatting.
ryu = "1.0"
# Serialization framework (we use custom value types + derive where useful).
serde = { version = "1.0", features = ["derive"] }
# Structured error types (used where errors are part of the API surface).
thiserror = "2.0"
# Blocking HTTP client (rustls TLS, no system OpenSSL) for the GitHub update check.
ureq = { version = "3", features = ["json"] }
# JSON parsing for the GitHub releases API response.
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
# Reads GOG's install registry keys for game-folder auto-detection.
windows-registry = "0.100"

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: restores winit's default features (Wayland dlopen + client-side
# decorations), which eframe only enables through its own `default` feature set.
# Keep in step with the winit version eframe depends on.
winit = "0.30"

[dev-dependencies]
# Nicer diffs for byte-for-byte roundtrip assertion failures.
pretty_assertions = "1.4"
# Temp dirs/files for test fixtures.
tempfile = "3.24"
